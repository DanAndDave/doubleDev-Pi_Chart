# Named, so the volume is this project's and not the directory's: a
# cluster initialised under the old role keeps it, and a renamed container
# on an old volume starts fine and refuses every connection.
name: pi-chart

services:
  thread-store:
    image: pgvector/pgvector:pg17
    container_name: pi-chart-thread-store
    environment:
      POSTGRES_USER: pi_chart
      POSTGRES_PASSWORD: pi_chart
      POSTGRES_DB: thread_store
    ports:
      - "${PICHART_PG_PORT:-55432}:5432"
    volumes:
      - thread-store-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_chart -d thread_store"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  thread-store-data:
