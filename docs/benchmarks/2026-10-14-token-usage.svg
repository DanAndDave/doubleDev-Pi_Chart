<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-labelledby="title">
	<title id="title">Vanilla omp is best on Cost, Uncached input, Cache write and Output</title>
	<style>
		text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
		.t { fill: #1f2328; }
		.m { fill: #59636e; }
		.b { fill: #1a7f37; font-size: 11px; }
		.v { fill: #1ea7f2; }
		.p { fill: #f57c00; }
		.h { font-size: 13px; font-weight: 600; }
		.n { font-weight: 700; }
		@media (prefers-color-scheme: dark) {
			.t { fill: #e6edf3; }
			.m { fill: #9198a1; }
			.b { fill: #3fb950; }
		}
	</style>

	<text x="20" y="26" class="t"><tspan font-size="15" font-weight="700">Vanilla omp is best on Cost, Uncached input, Cache write and Output</tspan><tspan dx="10" class="m">scaled per panel</tspan></text>
	<circle cx="650" cy="44" r="5" class="v"/><text x="660" y="48" class="m">vanilla omp</text>
	<circle cx="745" cy="44" r="5" class="p"/><text x="755" y="48" class="m">pi-chart</text>
	<circle cx="820" cy="44" r="5" class="b"/><text x="830" y="48" class="m">best</text>

	<!-- Row 1 -->
	<text x="20" y="66" class="t h">Cost</text>
	<rect x="20" y="74" width="89.8" height="9" rx="2" class="v"/><text x="117.8" y="83" class="t"><tspan class="n">$1.0043</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="20" y="90" width="190" height="9" rx="2" class="p"/><text x="218" y="99" class="m">$2.1255</text>

	<text x="310" y="66" class="t h">Prompt tokens sent</text>
	<rect x="310" y="74" width="190" height="9" rx="2" class="v"/><text x="508" y="83" class="m">1,335,274</text>
	<rect x="310" y="90" width="161.5" height="9" rx="2" class="p"/><text x="479.5" y="99" class="t"><tspan class="n">1,135,262</tspan><tspan dx="6" class="b">best</tspan></text>

	<text x="600" y="66" class="t h">Uncached input</text>
	<rect x="600" y="74" width="2" height="9" rx="1" class="v"/><text x="610" y="83" class="t"><tspan class="n">98</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="600" y="90" width="190" height="9" rx="2" class="p"/><text x="798" y="99" class="m">266,002</text>

	<!-- Row 2 -->
	<text x="20" y="146" class="t h">Cache write</text>
	<rect x="20" y="154" width="172.3" height="9" rx="2" class="v"/><text x="200.3" y="163" class="t"><tspan class="n">68,131</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="20" y="170" width="190" height="9" rx="2" class="p"/><text x="218" y="179" class="m">75,128</text>

	<text x="310" y="146" class="t h">Output</text>
	<rect x="310" y="154" width="142.3" height="9" rx="2" class="v"/><text x="460.3" y="163" class="t"><tspan class="n">9,485</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="310" y="170" width="190" height="9" rx="2" class="p"/><text x="508" y="179" class="m">12,663</text>

	<text x="600" y="146" class="t h">Peak window</text>
	<rect x="600" y="154" width="190" height="9" rx="2" class="v"/><text x="798" y="163" class="m">68,135</text>
	<rect x="600" y="170" width="134.5" height="9" rx="2" class="p"/><text x="742.5" y="179" class="m">48,219</text>

	<!-- Row 3 -->
	<text x="20" y="226" class="t h">Codeword recalled at the probe</text>
	<rect x="20" y="234" width="190" height="9" rx="2" class="v"/><text x="218" y="243" class="m">3/3</text>
	<rect x="20" y="250" width="190" height="9" rx="2" class="p"/><text x="218" y="259" class="m">3/3</text>

	<text x="310" y="226" class="t h">Build number recalled at the probe</text>
	<rect x="310" y="234" width="190" height="9" rx="2" class="v"/><text x="508" y="243" class="m">3/3</text>
	<rect x="310" y="250" width="2" height="9" rx="1" class="p"/><text x="320" y="259" class="m">0/3</text>
</svg>
