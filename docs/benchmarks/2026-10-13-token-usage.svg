<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-labelledby="title">
	<title id="title">Vanilla omp is best on Output, Effective input and Cost</title>
	<style>
		text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
		.t { fill: #1f2328; }
		.m { fill: #59636e; }
		.b { fill: #1a7f37; font-size: 11px; }
		.v { fill: #1ea7f2; }
		.p { fill: #f57c00; }
		.h { font-size: 13px; font-weight: 600; }
		.n { font-weight: 700; }
		@media (prefers-color-scheme: dark) {
			.t { fill: #e6edf3; }
			.m { fill: #9198a1; }
			.b { fill: #3fb950; }
		}
	</style>

	<text x="20" y="26" class="t"><tspan font-size="15" font-weight="700">Vanilla omp is best on Output, Effective input and Cost</tspan><tspan dx="10" class="m">scaled per panel</tspan></text>
	<circle cx="650" cy="22" r="5" class="v"/><text x="660" y="26" class="m">vanilla omp</text>
	<circle cx="745" cy="22" r="5" class="p"/><text x="755" y="26" class="m">pi-chart</text>
	<circle cx="820" cy="22" r="5" class="b"/><text x="830" y="26" class="m">best</text>

	<!-- Row 1 -->
	<text x="20" y="66" class="t h">Prompt tokens sent</text>
	<rect x="20" y="74" width="190" height="9" rx="2" class="v"/><text x="218" y="83" class="m">1,176,574</text>
	<rect x="20" y="90" width="141.5" height="9" rx="2" class="p"/><text x="169.5" y="99" class="t"><tspan class="n">876,059</tspan><tspan dx="6" class="b">best</tspan></text>

	<text x="310" y="66" class="t h">Cache read</text>
	<rect x="310" y="74" width="190" height="9" rx="2" class="v"/><text x="508" y="83" class="m">1,128,917</text>
	<rect x="310" y="90" width="115.8" height="9" rx="2" class="p"/><text x="433.8" y="99" class="m">687,862</text>

	<text x="600" y="66" class="t h">Cache write</text>
	<rect x="600" y="74" width="47.8" height="9" rx="2" class="v"/><text x="655.8" y="83" class="m">47,365</text>
	<rect x="600" y="90" width="190" height="9" rx="2" class="p"/><text x="798" y="99" class="m">188,107</text>

	<!-- Row 2 -->
	<text x="20" y="146" class="t h">Output</text>
	<rect x="20" y="154" width="176.5" height="9" rx="2" class="v"/><text x="204.5" y="163" class="t"><tspan class="n">9,789</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="20" y="170" width="190" height="9" rx="2" class="p"/><text x="218" y="179" class="m">10,540</text>

	<text x="310" y="146" class="t h">Effective input</text>
	<rect x="310" y="154" width="107.8" height="9" rx="2" class="v"/><text x="425.8" y="163" class="t"><tspan class="n">172,439</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="310" y="170" width="190" height="9" rx="2" class="p"/><text x="508" y="179" class="m">304,010</text>

	<text x="600" y="146" class="t h">Cost</text>
	<rect x="600" y="154" width="81.9" height="9" rx="2" class="v"/><text x="689.9" y="163" class="t"><tspan class="n">$0.80</tspan><tspan dx="6" class="b">best</tspan></text>
	<rect x="600" y="170" width="190" height="9" rx="2" class="p"/><text x="798" y="179" class="m">$1.86</text>

	<!-- Row 3 -->
	<text x="20" y="226" class="t h">Peak window</text>
	<rect x="20" y="234" width="190" height="9" rx="2" class="v"/><text x="218" y="243" class="m">59,729</text>
	<rect x="20" y="250" width="120.4" height="9" rx="2" class="p"/><text x="148.4" y="259" class="m">37,857</text>

	<text x="310" y="226" class="t h">Codeword recalled at turn 12</text>
	<rect x="310" y="234" width="190" height="9" rx="2" class="v"/><text x="508" y="243" class="m">3/3</text>
	<rect x="310" y="250" width="126.7" height="9" rx="2" class="p"/><text x="444.7" y="259" class="m">2/3</text>
</svg>
